# Drop-in: /etc/systemd/system/grok-station-wake.service.d/tls.conf
# Hands the root-only relay TLS files to the listener (which runs as an unprivileged user) via $CREDENTIALS_DIRECTORY.
[Service]
LoadCredential=relay-ca.crt:/etc/grok-station/tls/ca.crt
LoadCredential=relay-client.crt:/etc/grok-station/tls/client.crt
LoadCredential=relay-client.key:/etc/grok-station/tls/client.key
