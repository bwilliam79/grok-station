# Ready for .github/workflows/ (needs a token with workflow scope to push there).
name: pii-guard
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  pii-guard:
    # Forks never get the secrets: run PRs only when they come from this repo.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Scan tree, file names and last commit
        env:
          CI: "1"
          LEAK_TERMS: ${{ secrets.LEAK_TERMS }}
          PATTERNS: ${{ secrets.PII_GUARD_PATTERNS }}
        run: |
          f="$RUNNER_TEMP/pii-patterns"
          if [ -n "$PATTERNS" ]; then printf '%s\n' "$PATTERNS" > "$f"; else : > "$f"; fi
          PII_GUARD_PATTERNS="$f" bash tools/pii-guard tree
