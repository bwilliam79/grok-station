# LAN-only voice relay. Secrets live in ./.env next to this file (mode 600, never committed):
#   XAI_API_KEY=...   RELAY_TOKEN=...
services:
  relay:
    build: .
    container_name: grok-station-relay
    restart: unless-stopped
    env_file: .env
    environment:
      XAI_MODEL: grok-voice-3.0
      XAI_VOICE: luna
    ports:
      - "8790:8790"
    mem_limit: 128m
    logging:
      options: {max-size: "1m", max-file: "3"}
