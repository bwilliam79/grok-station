# LAN-only voice relay. Secrets are files outside the repo (dir mode 700, files 600), mounted at /run/secrets:
#   $GROK_STATION_SECRETS/xai_api_key   $GROK_STATION_SECRETS/relay_token (one token per line)   .../keyterms (optional)
# Usage counters persist in $GROK_STATION_STATE. Optional ntfy outbox dir: $GROK_STATION_ALERTS.
# LAN clients connect through the `tls` service (Caddy, wss + client certificate) on $GROK_STATION_TLS_PORT (8791);
# certs come from $GROK_STATION_PKI (server.crt, server.key, client-ca.crt). The relay's own port is published on the
# host's loopback only (GROK_STATION_RELAY_BIND, default 127.0.0.1) for local health checks.
services:
  relay:
    build: .
    container_name: grok-station-relay
    restart: unless-stopped
    environment:
      XAI_MODEL: grok-voice-3.0
      XAI_VOICE: luna
      MAX_SESSIONS_DAY: ${MAX_SESSIONS_DAY:-40}
      MAX_MINUTES_DAY: ${MAX_MINUTES_DAY:-20}
    secrets: [xai_api_key, relay_token, keyterms]
    volumes:
      - ${GROK_STATION_STATE:?set GROK_STATION_STATE}:/state
      - ${GROK_STATION_ALERTS:-./no-alerts}:/alerts
    ports:
      - "${GROK_STATION_RELAY_BIND:-127.0.0.1}:8790:8790"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    cpus: 0.5
    mem_limit: 128m
    memswap_limit: 128m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8790/health', timeout=3)"]
      interval: 60s
      timeout: 5s
    logging:
      options: {max-size: "1m", max-file: "3"}
  tls:
    image: caddy:2-alpine@sha256:de23def33b17fb5d1290b0f6c2add1d70780e52341896c00a4c8a2a2fe9d355e
    container_name: grok-station-tls
    restart: unless-stopped
    depends_on: [relay]
    ports:
      - "${GROK_STATION_TLS_PORT:-8791}:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${GROK_STATION_PKI:?set GROK_STATION_PKI}:/pki:ro
    read_only: true
    tmpfs: [/tmp, /data, /config]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]  # the image's caddy binary carries this file capability; exec fails without it
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    cpus: 0.5
    mem_limit: 128m
    memswap_limit: 128m
    logging:
      options: {max-size: "1m", max-file: "3"}
secrets:
  xai_api_key: {file: "${GROK_STATION_SECRETS:?set GROK_STATION_SECRETS}/xai_api_key"}
  relay_token: {file: "${GROK_STATION_SECRETS}/relay_token"}
  keyterms: {file: "${GROK_STATION_SECRETS}/keyterms"}
