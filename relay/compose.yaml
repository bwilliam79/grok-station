# LAN-only voice relay. Secrets are files outside the repo (dir mode 700, files 600), mounted at /run/secrets:
#   $GROK_STATION_SECRETS/xai_api_key   $GROK_STATION_SECRETS/relay_token (one token per line)   .../keyterms (optional)
# Handoff limit counters persist in $GROK_STATION_STATE. ntfy drop folder (dedicated to this relay): $GROK_STATION_ALERTS.
# Personas: private registry $GROK_STATION_PRIVATE/personas.json (dir 700, file 600, see personas.example.json) and two
# read-only portrait dirs $GROK_STATION_PORTRAITS_A / _B (photos are never in git). Without them only Grok is on voice.
# Enroll mode (docs/enroll.md): clip inbox $GROK_STATION_ENROLL (rw, writable by uid 10001) and published models
# $GROK_STATION_WAKEWORDS (ro), both on the training host.
# Teammate handoff (off by default): $GROK_STATION_SECRETS/webhooks.json and $GROK_STATION_VOICE (stats-dashboard's voice/).
# LAN clients connect through the `tls` service (Caddy, wss + client certificate) on $GROK_STATION_TLS_PORT (8791);
# certs come from $GROK_STATION_PKI (server.crt, server.key, client-ca.crt). The relay's own port is published on the
# host's loopback only (GROK_STATION_RELAY_BIND, default 127.0.0.1) for local health checks.
services:
  relay:
    build: .
    container_name: grok-station-relay
    restart: unless-stopped
    environment:
      XAI_MODEL: grok-voice-3.0
      XAI_VOICE: luna
      # Teammate handoff: off unless HANDOFF_ENABLED=1 in .env (see docs/handoff.md). Webhooks are hot-reloaded.
      HANDOFF_ENABLED: ${HANDOFF_ENABLED:-0}
    secrets: [xai_api_key, relay_token, keyterms, webhooks]
    volumes:
      - ${GROK_STATION_STATE:?set GROK_STATION_STATE}:/state
      - ${GROK_STATION_ALERTS:-./no-alerts}:/alerts
      - ${GROK_STATION_PRIVATE:-./no-personas}:/config:ro
      - ${GROK_STATION_PORTRAITS_A:-./no-personas}:/portraits/a:ro
      - ${GROK_STATION_PORTRAITS_B:-./no-personas}:/portraits/b:ro
      - ${GROK_STATION_ENROLL:-./no-enroll}:/enroll
      - ${GROK_STATION_WAKEWORDS:-./no-wakewords}:/wakewords:ro
      # Handoff binding dirs, shared with tile-ingest (POST /voice/reply): pending rw here, replies rw (consumed on read)
      - ${GROK_STATION_VOICE:-./no-voice}/pending:/voice/pending
      - ${GROK_STATION_VOICE:-./no-voice}/replies:/voice/replies
    ports:
      - "${GROK_STATION_RELAY_BIND:-127.0.0.1}:8790:8790"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    cpus: 0.5
    mem_limit: 128m
    memswap_limit: 128m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8790/health', timeout=3)"]
      interval: 60s
      timeout: 5s
    logging:
      options: {max-size: "1m", max-file: "3"}
  tls:
    build: {context: ., dockerfile: Dockerfile.caddy}
    image: grok-station-tls:local
    container_name: grok-station-tls
    user: "10002:10002"
    restart: unless-stopped
    depends_on: [relay]
    ports:
      - "${GROK_STATION_TLS_PORT:-8791}:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${GROK_STATION_PKI:?set GROK_STATION_PKI}:/pki:ro
    read_only: true
    tmpfs: ["/tmp:uid=10002,gid=10002", "/data:uid=10002,gid=10002", "/config:uid=10002,gid=10002"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    cpus: 0.5
    mem_limit: 128m
    memswap_limit: 128m
    logging:
      options: {max-size: "1m", max-file: "3"}
secrets:
  xai_api_key: {file: "${GROK_STATION_SECRETS:?set GROK_STATION_SECRETS}/xai_api_key"}
  relay_token: {file: "${GROK_STATION_SECRETS}/relay_token"}
  keyterms: {file: "${GROK_STATION_SECRETS}/keyterms"}
  # {"<bot>": {"url": "https://...", "token": "..."}}; home computer only, mode 600, never in git or on any other machine
  webhooks: {file: "${GROK_STATION_SECRETS}/webhooks.json"}
